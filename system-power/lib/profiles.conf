# Профиль «картошка» — единственный, который что-то настраивает.
#
# Режимы производительности и баланса НИЧЕГО не крутят: они просто возвращают
# систему к снимку (см. lib/snapshot.sh). Было бы странно «настраивать
# производительность» числами ниже заводских.
#
# ФОРМАТ: КЛЮЧ  <сеть> <батарея>

#КЛЮЧ              сеть       батарея

# --- процессор ---
CPU_EPP            power      power
CPU_TURBO          0          0
CPU_MAX_MHZ        1800000    1400000
CPUIDLE            teo        teo

# --- мощность ---
RAPL_LONG_UW       6000000    4000000
RAPL_SHORT_UW      8000000    6000000
USB_AUTOSUSPEND    2          2

# --- графика ---
IGPU_MAX_MHZ       450        350
IGPU_MIN_MHZ       200        200
WALLPAPER_FPS      20         10
WALLPAPER_GPU      intel      intel

# --- интерфейс ---
# plain = принудительный минимализм (тёмный Adwaita, без анимаций,
# непрозрачный док, без иконок рабочего стола и блюра)
GTK_THEME          plain      plain
ICON_THEME         plain      plain
COLOR_SCHEME       plain      plain
FONT_AA            grayscale  grayscale
FONT_HINTING       none       none
DOCK               plain      plain
GNOME_ANIM         0          0
EXT_DISABLE        ding@rastersoft.com,blur-my-shell@aunetx ding@rastersoft.com,blur-my-shell@aunetx
EXTRAS             0          0

# ВНИМАНИЕ: RAPL_SHORT_UW должен быть >= RAPL_LONG_UW.
#
# Живые обои картошка не трогает — этим занимается общее правило:
# на батарее движок выключается, кроме режима производительности.
