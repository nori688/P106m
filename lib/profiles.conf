# Таблица профилей system-power
#
# ФОРМАТ: КЛЮЧ  <6 значений>
#         порядок колонок: perf_ac  perf_bat  bal_ac  bal_bat  pow_ac  pow_bat
#         разделитель — пробелы
#
# Значения baseline / plain ссылаются на снимок настроек интерфейса
# (system-power snapshot). baseline = вернуть как было у тебя,
# plain = принудительно примитив (Adwaita, без анимаций и прозрачности).
# Для списков «-» означает «ничего».

#КЛЮЧ              perf_ac    perf_bat   bal_ac     bal_bat    pow_ac     pow_bat

# --- процессор ---
CPU_EPP            performance balance_performance balance_performance balance_power power power
CPU_TURBO          1          1          1          1          0          0
CPU_MAX_MHZ        3400000    3400000    3400000    2400000    1800000    1400000
CPUIDLE            menu       menu       menu       menu       teo        teo

# --- мощность и шина ---
RAPL_LONG_UW       15000000   12000000   12000000   10000000   6000000    4000000
RAPL_SHORT_UW      20000000   20000000   20000000   15000000   8000000    6000000
ASPM               performance default    default    powersave  powersave  powersave
USB_AUTOSUSPEND    0          2          2          2          2          2

# --- графика ---
IGPU_MAX_MHZ       1200       1100       900        700        450        350
IGPU_MIN_MHZ       200        200        200        200        200        200
WALLPAPER          animated   animated   animated   animated   off        off
WALLPAPER_FPS      30         30         30         30         10         10
WALLPAPER_GPU      nvidia     nvidia     nvidia     nvidia     intel      intel

# --- интерфейс ---
GTK_THEME          baseline   baseline   baseline   baseline   plain      plain
ICON_THEME         baseline   baseline   baseline   baseline   plain      plain
COLOR_SCHEME       baseline   baseline   baseline   baseline   plain      plain
FONT_AA            baseline   baseline   baseline   baseline   grayscale  grayscale
FONT_HINTING       baseline   baseline   baseline   baseline   none       none
BACKGROUND         baseline   baseline   baseline   baseline   solid      solid
DOCK               baseline   baseline   baseline   baseline   plain      plain
GNOME_ANIM         1          1          1          1          0          0
EXT_DISABLE        -          -          -          -          ding@rastersoft.com,blur-my-shell@aunetx ding@rastersoft.com,blur-my-shell@aunetx
EXTRAS             1          1          1          1          0          0

# ВНИМАНИЕ: RAPL_SHORT_UW должен быть >= RAPL_LONG_UW.
# Правится руками; после правки — `system-power apply`.
