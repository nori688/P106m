# Куда: /etc/modprobe.d/blacklist-nouveau.conf
#
# Без этого свободный драйвер nouveau перехватит карту и будет работать
# на «загрузочных» частотах: в тестах он оказался в 12 раз медленнее
# встроенной Intel UHD (44 против 550 FPS на 1080p), потому что не умеет
# поднимать частоты Pascal (нужна подписанная прошивка NVIDIA).

blacklist nouveau
blacklist lbm-nouveau
alias nouveau off
